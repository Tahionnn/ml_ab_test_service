repos:
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3.13

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - types-requests
          - types-redis
          - types-PyYAML
          - sqlalchemy[mypy]
          - fastapi
          - faststream[kafka]
        args:
          - --strict
          - --ignore-missing-imports
          - --explicit-package-bases
          - --namespace-packages
          - --disable-error-code=no-any-return
          - --disable-error-code=unused-ignore
          - --disable-error-code=type-arg
          - --disable-error-code=misc
        exclude: ^coding-agent/tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint
        language: system
        types: [go]

      - id: go-fmt
        name: go-fmt
        entry: go fmt ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: go-imports
        name: go-imports
        entry: goimports -w
        language: system
        types: [go]

      - id: go-unit-tests
        name: go-unit-tests
        entry: bash -lc 'go test ./...'
        language: system
        pass_filenames: false
        types: [go]
